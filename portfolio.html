<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIXELARC | PORTFOLIO</title>
<link rel="icon" type="image/png" href="images/favicon/web-app-manifest-512x512.png">
<link rel="apple-touch-icon" href="images/favicon/web-app-manifest-512x512.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="portfolio">

<header id="site-header" class="site-header"></header>

<!-- ================= 히어로 ================= -->
<section class="pf-hero">
  <div class="container">
    <div class="eyebrow">PORTFOLIO</div>
    <div class="text-hero-row">
      <h1 class="text-hero-title">우리가 만든 모든 장면에는<br><span class="accent">이야기</span>가 있습니다.</h1>
      <p class="text-hero-desc">기획부터 촬영, 편집까지 영상의 모든 과정을 함께하며,<br>브랜드의 메시지가 가장 효과적으로 전달될 수 있도록<br>최선을 다합니다.</p>
    </div>
  </div>
</section>

<!-- ================= 필터 + 목록 ================= -->
<section class="section section-black pf-list-section pf-list-bottom">
  <div class="container">
    <div class="pf-filter">
      <button class="active" data-filter="all" onclick="setPfFilter('all', this)">ALL</button>
      <button data-filter="youtube" onclick="setPfFilter('youtube', this)">유튜브 콘텐츠</button>
      <button data-filter="shortform" onclick="setPfFilter('shortform', this)">숏폼 콘텐츠</button>
      <button data-filter="promo" onclick="setPfFilter('promo', this)">기업 홍보영상</button>
      <button data-filter="event" onclick="setPfFilter('event', this)">행사·스케치</button>
      <button data-filter="etc" onclick="setPfFilter('etc', this)">기타</button>
    </div>

    <div class="pf-grid" id="pf-grid"><!-- JS로 자동 렌더링 --></div>
    <div class="pagination" id="pf-pagination"></div>
  </div>
</section>

<!-- ================= 대표 포트폴리오 ================= -->
<section class="section section-dark featured-section">
  <div class="container">
    <div class="eyebrow">FEATURED</div>
    <h2 class="section-title" style="margin-bottom:44px;">대표 포트폴리오</h2>
    <div class="featured-pf" id="featured-pf-wrap"><!-- JS로 자동 렌더링 --></div>
  </div>
</section>

<!-- ================= CTA (공통) ================= -->
<div class="cta-slot"></div>

<footer id="site-footer" class="site-footer"></footer>

<script src="js/common.js"></script>
<script src="js/portfolio-data.js"></script>
<script src="js/portfolio.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    renderPortfolioList();
    renderFeaturedPortfolio();
  });
</script>
</body>
</html>
