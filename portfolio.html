<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIXELARC | PORTFOLIO</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="portfolio">

<header id="site-header" class="site-header"></header>

<!-- ================= 히어로 (이미지 슬라이드) ================= -->
<section class="pf-hero">
  <div class="container pf-hero-grid">
    <div>
      <div class="eyebrow">PORTFOLIO</div>
      <h1 style="font-size:38px;font-weight:800;line-height:1.4;margin:12px 0 20px;">우리가 만든<br>모든 장면에는<br><span class="accent" style="text-decoration:underline;">이야기</span>가 있습니다.</h1>
      <p style="color:var(--c-gray-400);line-height:1.8;font-size:14px;">픽셀아크는 기획부터 촬영, 편집까지<br>영상의 모든 과정을 함께하며,<br>브랜드의 메시지가 가장 효과적으로 전달될 수 있도록<br>최선을 다합니다.</p>
      <div class="pf-counter"><span id="pfSliderCounter">01 / 03</span><span class="bar"></span></div>
    </div>
    <div>
      <!-- 히어로 이미지 여러 장: 아래 .pf-slide를 복사해서 원하는 만큼 추가하면 자동으로 순환됩니다 -->
      <div class="pf-slider" id="pfHeroSlider">
        <div class="pf-slide"><div class="img-placeholder">포트폴리오 소개 이미지 1</div></div>
        <div class="pf-slide"><div class="img-placeholder">포트폴리오 소개 이미지 2</div></div>
        <div class="pf-slide"><div class="img-placeholder">포트폴리오 소개 이미지 3</div></div>
      </div>
    </div>
  </div>
</section>

<!-- ================= 필터 + 목록 ================= -->
<section class="section section-black" style="padding-top:56px;">
  <div class="container">
    <div class="pf-filter">
      <button class="active" onclick="setPfFilter('all', this)">ALL</button>
      <button onclick="setPfFilter('youtube', this)">유튜브 콘텐츠</button>
      <button onclick="setPfFilter('shortform', this)">숏폼 콘텐츠</button>
      <button onclick="setPfFilter('promo', this)">기업 홍보영상</button>
      <button onclick="setPfFilter('event', this)">행사·스케치</button>
      <button onclick="setPfFilter('etc', this)">기타</button>
    </div>

    <div class="pf-grid" id="pf-grid"><!-- JS로 자동 렌더링 --></div>
    <div class="pagination" id="pf-pagination"></div>
  </div>
</section>

<!-- ================= 대표 포트폴리오 ================= -->
<section class="section section-dark">
  <div class="container featured-pf" id="featured-pf-wrap"><!-- JS로 자동 렌더링 --></div>
</section>

<!-- ================= CTA (공통) ================= -->
<div class="cta-slot"></div>

<footer id="site-footer" class="site-footer"></footer>

<script src="js/common.js"></script>
<script src="js/portfolio-data.js"></script>
<script src="js/portfolio.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    initSlider('pfHeroSlider', 'pfSliderCounter', 4000);
    renderPortfolioList();
    renderFeaturedPortfolio();
  });
</script>
</body>
</html>
